server {
    listen 80;
    listen [::]:80;
    server_name plugin.gonavi.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://plugin.gonavi.org$request_uri;
    }
}
