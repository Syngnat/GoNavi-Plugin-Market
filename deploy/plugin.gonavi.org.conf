server {
    listen 80;
    listen [::]:80;
    server_name plugin.gonavi.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://plugin.gonavi.org$request_uri;
    }
}

server {
    listen 2053 ssl;
    listen [::]:2053 ssl;
    server_name plugin.gonavi.org;

    ssl_certificate /etc/letsencrypt/live/plugin.gonavi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plugin.gonavi.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    port_in_redirect off;

    root /srv/gonavi-plugin-market/current;
    index index.html;

    access_log /var/log/nginx/gonavi-plugin-market-access.log;
    error_log /var/log/nginx/gonavi-plugin-market-error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 指纹哈希命名的构建产物：内容不可变，缓存一年。
    location /assets/ {
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 入口文件指向 current 软链，发布后必须立即拿到新版本：不缓存。
    location = /index.html {
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /favicon.svg {
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA 路由（/plugins/:id、/login）回退到入口文件；/index.html 的 no-cache 生效。
    location / {
        limit_req zone=gonavi_req burst=60 nodelay;
        limit_req_status 429;
        limit_conn gonavi_conn 100;
        try_files $uri /index.html;
    }
}
