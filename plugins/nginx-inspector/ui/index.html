<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Nginx Inspector</title>
  <!-- The host serves this document at "/" and only exposes package files
       under /plugin-assets/<path-from-package-root>, so references must be
       absolute and keep the ui/ prefix; relative refs hit the unreachable site root. -->
  <link rel="stylesheet" href="/plugin-assets/ui/styles.css" />
</head>
<body>
  <a class="skip" id="skip" href="#main">跳到主内容</a>
  <div id="app">
    <aside class="rail" aria-label="Nginx Inspector">
      <div class="brand"><span class="brand-name">Nginx Inspector</span><small id="brand-sub"></small></div>
      <div class="conn-block">
        <div class="conn-picker">
          <span id="conn-dot" class="conn-dot" aria-hidden="true"></span>
          <select id="conn-select" aria-label="连接"></select>
        </div>
        <div class="conn-actions">
          <button type="button" id="conn-test" class="mini">测试</button>
        </div>
        <div class="conn-meta" id="conn-meta"></div>
      </div>
      <nav id="nav" aria-label="主分区"></nav>
      <div class="spacer"></div>
      <div class="foot" id="foot"></div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="modal-backdrop" aria-hidden="true">
    <div id="modal" role="dialog" aria-modal="true" tabindex="-1"></div>
  </div>

  <script src="/plugin-assets/ui/app.js"></script>
</body>
</html>
