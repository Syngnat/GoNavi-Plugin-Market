<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Nginx Inspector</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="rail">
      <div class="brand">Nginx Inspector<small id="brand-sub"></small></div>
      <div class="conn-block">
        <span id="conn-dot" class="conn-dot"></span><span id="conn-label"></span>
        <select id="conn-select"></select>
        <div class="conn-meta" id="conn-meta"></div>
      </div>
      <nav id="nav"></nav>
      <div class="spacer"></div>
      <div class="foot" id="foot"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div id="toast"></div>

  <div id="modal-backdrop">
    <div id="modal"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
