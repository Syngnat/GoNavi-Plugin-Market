<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MongoShell</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  html, body { margin: 0; min-height: 100%; background: transparent; color: inherit; }
  body { padding: 14px; box-sizing: border-box; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .bar strong { font-size: 15px; }
  .muted { opacity: .65; font-size: 12px; }
  select, input, textarea, button { font: inherit; }
  select, input { min-height: 30px; padding: 4px 8px; border: 1px solid rgba(127,127,127,.35); border-radius: 6px; background: transparent; color: inherit; }
  textarea { width: 100%; min-height: 190px; box-sizing: border-box; padding: 10px; border: 1px solid rgba(127,127,127,.35); border-radius: 6px; background: transparent; color: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; resize: vertical; }
  button { padding: 5px 12px; border: 1px solid rgba(127,127,127,.35); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  button.primary { border-color: #0f766e; background: #0f766e; color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .status { margin-left: auto; font-size: 12px; }
  .error { border: 1px solid #dc2626; border-radius: 6px; padding: 8px 10px; margin: 10px 0; color: #dc2626; white-space: pre-wrap; }
  .result { margin-top: 12px; border: 1px solid rgba(127,127,127,.3); border-radius: 6px; padding: 10px; overflow: auto; max-height: 48vh; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border-bottom: 1px solid rgba(127,127,127,.25); padding: 4px 6px; text-align: left; vertical-align: top; }
  th { font-weight: 600; }
</style>
  <script>
    // 工作台页是内嵌 iframe：宿主通过 gonavi:host-preferences 注入 locale，
    // 这里只做最小词典，未识别的语言一律回退英文。
    (function () {
      const table = {
        'zh-CN': { database: '数据库', collection: '集合', optional: '可选', run: '运行', starting: '启动中', connecting: '连接中', ready: '就绪', readOnly: '只读', notConnected: '未连接', running: '执行中', done: '完成', failed: '失败' },
        'zh-TW': { database: '資料庫', collection: '集合', optional: '選填', run: '執行', starting: '啟動中', connecting: '連線中', ready: '就緒', readOnly: '唯讀', notConnected: '未連線', running: '執行中', done: '完成', failed: '失敗' },
        'ja-JP': { database: 'データベース', collection: 'コレクション', optional: '任意', run: '実行', starting: '起動中', connecting: '接続中', ready: '準備完了', readOnly: '読み取り専用', notConnected: '未接続', running: '実行中', done: '完了', failed: '失敗' },
        'de-DE': { database: 'Datenbank', collection: 'Collection', optional: 'optional', run: 'Ausführen', starting: 'Startet', connecting: 'Verbinden', ready: 'Bereit', readOnly: 'Schreibgeschützt', notConnected: 'Nicht verbunden', running: 'Läuft', done: 'Fertig', failed: 'Fehlgeschlagen' },
        'ru-RU': { database: 'База данных', collection: 'Коллекция', optional: 'необязательно', run: 'Выполнить', starting: 'Запуск', connecting: 'Подключение', ready: 'Готово', readOnly: 'Только чтение', notConnected: 'Нет подключения', running: 'Выполняется', done: 'Готово', failed: 'Ошибка' },
        'en-US': { database: 'Database', collection: 'Collection', optional: 'optional', run: 'Run', starting: 'starting', connecting: 'connecting', ready: 'ready', readOnly: 'read-only', notConnected: 'not connected', running: 'running', done: 'done', failed: 'failed' },
      };
      const resolve = () => {
        const prefs = window.gonaviHostPrefs;
        const raw = prefs && typeof prefs.locale === 'string' ? prefs.locale : ((typeof navigator !== 'undefined' && navigator.language) || 'en-US');
        if (table[raw]) return raw;
        const lower = String(raw).toLowerCase();
        if (lower.indexOf('zh') === 0) return lower.indexOf('tw') > -1 || lower.indexOf('hk') > -1 ? 'zh-TW' : 'zh-CN';
        const base = lower.split('-')[0];
        for (const key of Object.keys(table)) { if (key.toLowerCase().indexOf(base + '-') === 0) return key; }
        return 'en-US';
      };
      window.__gonaviPageText = (key) => {
        const locale = resolve();
        const dict = table[locale] || table['en-US'];
        return dict[key] || table['en-US'][key] || key;
      };
      const apply = () => {
        for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = window.__gonaviPageText(node.dataset.i18n);
        for (const node of document.querySelectorAll('[data-i18n-placeholder]')) node.setAttribute('placeholder', window.__gonaviPageText(node.dataset.i18nPlaceholder));
      };
      if (typeof window.addEventListener === 'function') {
        window.addEventListener('message', (event) => {
          const data = event && event.data;
          if (data && data.type === 'gonavi:host-preferences') apply();
        });
      }
      if (typeof document.addEventListener === 'function') document.addEventListener('DOMContentLoaded', apply);
    }());
  </script>
</head>
<body>
<div class="bar">
  <strong>MongoShell</strong>
  <span id="conn" class="muted">connecting…</span>
  <label class="muted"><span data-i18n="database">Database</span> <select id="db" disabled><option value="">(none)</option></select></label>
  <label class="muted"><span data-i18n="collection">Collection</span> <input id="collection" placeholder="optional" data-i18n-placeholder="optional" /></label>
  <button id="run" class="primary" type="button" disabled data-i18n="run">Run</button>
  <span id="status" class="status" data-i18n="starting">starting</span>
</div>
<div id="error" class="error" hidden></div>
<textarea id="editor" spellcheck="false" aria-label="MongoShell JavaScript">db.getCollectionNames()</textarea>
<div id="result" class="result" hidden></div>
<script>
(() => {
  const launch = window.__gonaviLaunch || {};
  const conn = document.getElementById('conn');
  const dbSelect = document.getElementById('db');
  const collection = document.getElementById('collection');
  const editor = document.getElementById('editor');
  const runButton = document.getElementById('run');
  const status = document.getElementById('status');
  const errorBox = document.getElementById('error');
  const resultBox = document.getElementById('result');
  let sessionId = '';
  let disposed = false;
  let running = false;
  const setStatus = (text) => { status.textContent = text; };
  const setError = (error) => {
    const message = error && (error.message || error.code) ? String(error.message || error.code) : String(error || '');
    errorBox.hidden = !message;
    errorBox.textContent = message;
  };
  const call = async (command, args) => {
    const payload = await window.gonavi.call('plugin.invoke', {
      command,
      arguments: args || {},
      connectionId: launch.connectionId || '',
    });
    if (!payload || typeof payload !== 'object' || typeof payload.ok !== 'boolean') {
      throw new Error('The plugin backend returned an invalid response.');
    }
    if (!payload.ok) {
      const failure = payload.error || {};
      const error = new Error(failure.message || failure.code || 'The command failed.');
      error.code = failure.code || 'internal';
      throw error;
    }
    if (!payload.data || typeof payload.data !== 'object') {
      throw new Error('The plugin backend returned invalid data.');
    }
    return payload.data;
  };
  const release = (id) => call('disconnect', { sessionId: id }).catch(() => {});
  const dispose = () => {
    disposed = true;
    const id = sessionId;
    sessionId = '';
    runButton.disabled = true;
    dbSelect.disabled = true;
    if (id) void release(id);
  };
  const render = (data) => {
    resultBox.hidden = false;
    resultBox.textContent = '';
    if (data && data.table && Array.isArray(data.table.columns) && Array.isArray(data.table.rows)) {
      const table = document.createElement('table');
      const head = document.createElement('tr');
      data.table.columns.forEach((column) => {
        const th = document.createElement('th');
        th.textContent = typeof column === 'string' ? column : String(column.name || '');
        head.appendChild(th);
      });
      table.appendChild(head);
      data.table.rows.forEach((row) => {
        const tr = document.createElement('tr');
        (Array.isArray(row) ? row : [row]).forEach((cell) => {
          const td = document.createElement('td');
          td.textContent = cell === null || cell === undefined ? '' : (typeof cell === 'object' ? JSON.stringify(cell) : String(cell));
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      resultBox.appendChild(table);
      if (data.output && data.output.length) {
        const pre = document.createElement('pre');
        pre.textContent = data.output.join('\n');
        resultBox.appendChild(pre);
      }
      return;
    }
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(data, null, 2);
    resultBox.appendChild(pre);
  };
  const connect = async () => {
    setStatus(window.__gonaviPageText('connecting'));
    try {
      const data = await call('connect', {
        connectionId: launch.connectionId || '',
        database: launch.database || '',
        collection: launch.collection || '',
        connectionName: launch.connectionName || 'MongoDB',
        environmentType: launch.environmentType || '',
        readOnly: launch.readOnly === true,
      });
      if (typeof data.sessionId !== 'string' || !data.sessionId) {
        throw new Error('The plugin backend did not return a sessionId.');
      }
      if (disposed) {
        await release(data.sessionId);
        return;
      }
      sessionId = data.sessionId;
      conn.textContent = data && data.host ? data.host : (launch.connectionName || 'MongoDB');
      if (data && Array.isArray(data.databases)) {
        dbSelect.textContent = '';
        data.databases.forEach((item) => {
          const name = typeof item === 'string' ? item : String(item && (item.name || item.database) || '');
          if (!name) return;
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          dbSelect.appendChild(option);
        });
        if (data.database) dbSelect.value = data.database;
      }
      collection.value = launch.collection || '';
      dbSelect.disabled = false;
      runButton.disabled = false;
      setStatus(window.__gonaviPageText(data && data.readOnly ? 'readOnly' : 'ready'));
    } catch (error) {
      setStatus(window.__gonaviPageText('notConnected'));
      setError(error);
    }
  };
  const run = async () => {
    if (!sessionId || disposed || running) return;
    running = true;
    runButton.disabled = true;
    setStatus(window.__gonaviPageText('running'));
    setError(null);
    try {
      const data = await call('run', {
        sessionId,
        script: editor.value,
        database: dbSelect.value || '',
        collection: collection.value.trim(),
        maxRows: 200,
      });
      render(data);
      setStatus(window.__gonaviPageText('done'));
    } catch (error) {
      setStatus(window.__gonaviPageText('failed'));
      setError(error);
    } finally {
      running = false;
      runButton.disabled = disposed || !sessionId;
    }
  };
  runButton.addEventListener('click', run);
  editor.addEventListener('keydown', (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
      event.preventDefault();
      void run();
    }
  });
  window.addEventListener('pagehide', dispose);
  window.addEventListener('beforeunload', dispose);
  conn.textContent = launch.connectionName || 'MongoDB';
  void connect();
})();
</script>
</body>
</html>
