<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MongoShell</title>
<style>
  /* Same tokens as the rest of GoNavi: flat surfaces, hairline rules, one blue accent. */
  :root {
    color-scheme: light dark;
    --surface: #ffffff;
    --surface-sunken: #fafafb;
    --surface-hover: #f5f7fa;
    --border: #f0f0f2;
    --border-strong: #e5e5ea;
    --text: #1d1d24;
    --text-secondary: #595964;
    --text-muted: #8c8c96;
    --accent: #1677ff;
    --accent-hover: #4096ff;
    --danger: #ff4d4f;
    --danger-soft: #fef2f2;
    --danger-border: #fecaca;
    --danger-text: #b91c1c;
    --radius: 8px;
    --radius-sm: 4px;
    --ui-font: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono-font: "JetBrains Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #16181d; --surface-sunken: #12141a; --surface-hover: #1f2229;
      --border: #23262d; --border-strong: #2c3037;
      --text: #e6e8ec; --text-secondary: #a0a4ad; --text-muted: #737780;
      --accent: #4d9bff; --accent-hover: #6cadff;
      --danger-soft: #2a1618; --danger-border: #4c2326; --danger-text: #ff9a9c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font: 400 13px/1.5 var(--ui-font);
    -webkit-font-smoothing: antialiased;
  }
  .shell { display: flex; flex-direction: column; min-height: 100vh; }

  /* connection strip */
  .strip {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 44px; padding: 8px 16px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .strip-id { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .monogram {
    display: grid; place-items: center; width: 26px; height: 26px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface-sunken); color: var(--accent);
    font: 600 12px/1 var(--mono-font);
  }
  .strip-host {
    color: var(--text-secondary); font: 400 12px/1.3 var(--mono-font);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .strip-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .chip {
    display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface-sunken); color: var(--text-secondary);
    font: 500 11px/1 var(--mono-font); white-space: nowrap;
  }
  .status {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
    border: 1px solid var(--border-strong); border-radius: 999px;
    background: var(--surface-sunken); color: var(--text-secondary);
    font: 500 12px/1 var(--mono-font); white-space: nowrap;
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .75; }

  /* query toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    min-height: 46px; padding: 8px 16px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .field { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .field > span { color: var(--text-secondary); font: 500 12px/1 var(--ui-font); white-space: nowrap; }
  .field-grow { flex: 1 1 200px; }
  select, input {
    height: 30px; min-width: 0; padding: 0 10px;
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    background: var(--surface); color: var(--text);
    font: 400 13px/1 var(--mono-font); outline: none;
  }
  .field-grow input { flex: 1; }
  #maxrows { width: 76px; }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
  select:disabled, input:disabled { background: var(--surface-sunken); color: var(--text-muted); }
  .toolbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  button {
    height: 30px; padding: 0 12px;
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    background: var(--surface); color: var(--text);
    font: 500 12px/1 var(--ui-font); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
  button.ghost:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
  button.primary {
    display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 14px;
    border-color: var(--accent); background: var(--accent); color: #fff;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  button.primary kbd {
    padding: 2px 5px; border-radius: var(--radius-sm);
    background: rgba(255,255,255,.18); color: rgba(255,255,255,.92);
    font: 500 10px/1 var(--mono-font);
  }

  /* error banner */
  .error {
    display: flex; align-items: baseline; gap: 10px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--danger-border);
    background: var(--danger-soft); color: var(--danger-text);
    font: 400 12px/1.5 var(--ui-font); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .error[hidden] { display: none; }

  /* panes */
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 32px; padding: 0 16px;
    border-bottom: 1px solid var(--border); background: var(--surface-sunken);
  }
  .pane-title {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 11px/1 var(--ui-font); letter-spacing: .04em; text-transform: uppercase;
  }
  .pane-title::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .pane-meta {
    color: var(--text-muted); font: 400 12px/1 var(--mono-font);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pane-meta.warn { color: #b45309; }
  #editor {
    width: 100%; min-height: 170px; margin: 0; padding: 12px 16px;
    border: 0; border-bottom: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font: 400 12.5px/1.65 var(--mono-font); tab-size: 2; resize: vertical; outline: none;
  }
  .result-pane { flex: 1; min-height: 0; }
  #result {
    flex: 1; min-height: 120px; max-height: 52vh; overflow: auto;
    padding: 0; background: var(--surface);
  }
  #result[hidden] { display: none; }
  #result table { width: 100%; border-collapse: collapse; font: 400 12px/1.5 var(--mono-font); }
  #result th {
    position: sticky; top: 0; z-index: 10; height: 30px; padding: 0 12px;
    border-bottom: 1px solid var(--border); background: var(--surface-sunken);
    color: var(--text-secondary); font: 500 11px/1 var(--mono-font);
    letter-spacing: .04em; text-transform: uppercase; text-align: left; white-space: nowrap;
  }
  #result td {
    height: 28px; padding: 0 12px; border-bottom: 1px solid var(--border);
    color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px;
  }
  #result tr:hover td { background: var(--surface-hover); }
  #result pre {
    margin: 0; padding: 10px 16px; border-top: 1px solid var(--border);
    background: var(--surface-sunken); color: var(--text-secondary);
    font: 400 12px/1.6 var(--mono-font); white-space: pre-wrap;
  }
  .empty { padding: 18px 16px; color: var(--text-muted); font: 400 12px/1.6 var(--ui-font); }

  .footer {
    display: flex; align-items: center; gap: 10px;
    height: 28px; padding: 0 16px; margin-top: auto;
    border-top: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); font: 400 11.5px/1 var(--mono-font);
  }
  .footer .spacer { flex: 1; }
  .footer .danger { color: var(--danger); }
</style>
</head>

      'ru-RU': { database: 'База данных', collection: 'Коллекция', optional: 'необязательная коллекция', run: 'Выполнить', clear: 'Очистить', maxRows: 'Максимум строк', script: 'Скрипт', result: 'Результат', starting: 'Запуск', connecting: 'Подключение', ready: 'Готово', readOnly: 'Только чтение', notConnected: 'Нет подключения', running: 'Выполняется', done: 'Готово', failed: 'Ошибка', noQuery: 'Запросов ещё не было', empty: 'Выполните скрипт, чтобы увидеть результаты.', writes: 'Запись разрешена', writesOff: 'Только чтение', truncated: 'Достигнут лимит строк: показаны первые {{rows}}.' },
      'en-US': { database: 'Database', collection: 'Collection', optional: 'optional collection', run: 'Run', clear: 'Clear', maxRows: 'Max rows', script: 'Script', result: 'Result', starting: 'starting', connecting: 'connecting', ready: 'ready', readOnly: 'read-only', notConnected: 'not connected', running: 'running', done: 'done', failed: 'failed', noQuery: 'No query yet', empty: 'Run a script to see documents here.', writes: 'Writes enabled', writesOff: 'Read-only', truncated: 'Row limit reached: showing the first {{rows}} rows.' },
    };
    const resolve = () => {
      const prefs = window.gonaviHostPrefs;
      const raw = prefs && typeof prefs.locale === 'string' ? prefs.locale : ((typeof navigator !== 'undefined' && navigator.language) || 'en-US');
      if (table[raw]) return raw;
      const lower = String(raw).toLowerCase();
      if (lower.indexOf('zh') === 0) return lower.indexOf('tw') > -1 || lower.indexOf('hk') > -1 ? 'zh-TW' : 'zh-CN';
      const base = lower.split('-')[0];
      for (const key of Object.keys(table)) { if (key.toLowerCase().indexOf(base + '-') === 0) return key; }
      return 'en-US';
    };
    window.__gonaviPageText = (key, params) => {
      const dict = table[resolve()] || table['en-US'];
      let text = dict[key] || table['en-US'][key] || key;
      if (params && typeof text === 'string') {
        for (const name of Object.keys(params)) text = text.split('{{' + name + '}}').join(String(params[name]));
      }
      return text;
    };
    const apply = () => {
      for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = window.__gonaviPageText(node.dataset.i18n);
      for (const node of document.querySelectorAll('[data-i18n-placeholder]')) node.setAttribute('placeholder', window.__gonaviPageText(node.dataset.i18nPlaceholder));
    };
    if (typeof window.addEventListener === 'function') {
      window.addEventListener('message', (event) => {
        const data = event && event.data;
        if (data && data.type === 'gonavi:host-preferences') apply();
      });
    }
    if (typeof document.addEventListener === 'function') document.addEventListener('DOMContentLoaded', apply);
  }());
</script>
<div class="shell">
  <div class="strip">
    <div class="strip-id">
      <span class="monogram" aria-hidden="true">M</span>
      <span id="conn" class="strip-host">MongoDB</span>
    </div>
    <div class="strip-actions">
      <span id="env" class="chip" hidden></span>
      <span id="readonly" class="chip" hidden data-i18n="readOnly">read-only</span>
      <span id="status" class="status" data-i18n="starting">starting</span>
    </div>
  </div>

  <div id="error" class="error" role="alert" hidden></div>

  <div class="toolbar">
    <label class="field">
      <span data-i18n="database">Database</span>
      <select id="db" disabled><option value="">(none)</option></select>
    </label>
    <label class="field field-grow">
      <span data-i18n="collection">Collection</span>
      <input id="collection" placeholder="optional collection" data-i18n-placeholder="optional" />
    </label>
    <label class="field">
      <span data-i18n="maxRows">Max rows</span>
      <input id="maxrows" type="number" min="1" max="2000" step="1" value="200" />
    </label>
    <div class="toolbar-actions">
      <button id="clear" class="ghost" type="button" data-i18n="clear">Clear</button>
      <button id="run" class="primary" type="button" disabled>
        <span data-i18n="run">Run</span>
        <kbd>⌘/Ctrl ↵</kbd>
      </button>
    </div>
  </div>

  <section class="pane">
    <header class="pane-header">
      <span class="pane-title" data-i18n="script">Script</span>
      <span id="scope" class="pane-meta"></span>
    </header>
    <textarea id="editor" spellcheck="false" aria-label="MongoShell JavaScript">db.getCollectionNames()</textarea>
  </section>

  <section class="pane result-pane">
    <header class="pane-header">
      <span class="pane-title" data-i18n="result">Result</span>
      <span id="resultMeta" class="pane-meta" data-i18n="noQuery">No query yet</span>
    </header>
    <div id="result" hidden></div>
    <div id="empty" class="empty" data-i18n="empty">Run a script to see documents here.</div>
  </section>

  <div class="footer">
    <span id="footerHost">—</span>
    <span id="footerWrites" data-i18n="writes">Writes enabled</span>
    <span class="spacer"></span>
    <span id="footerElapsed">—</span>
  </div>
</div>
<script>
(() => {
  const launch = window.__gonaviLaunch || {};
  const conn = document.getElementById('conn');
  const dbSelect = document.getElementById('db');
  const collection = document.getElementById('collection');
  const editor = document.getElementById('editor');
  const runButton = document.getElementById('run');
  const clearButton = document.getElementById('clear');
  const maxRowsInput = document.getElementById('maxrows');
  const status = document.getElementById('status');
  const errorBox = document.getElementById('error');
  const resultBox = document.getElementById('result');
  const emptyBox = document.getElementById('empty');
  const resultMeta = document.getElementById('resultMeta');
  const scope = document.getElementById('scope');
  const envChip = document.getElementById('env');
  const readonlyChip = document.getElementById('readonly');
  const footerHost = document.getElementById('footerHost');
  const footerWrites = document.getElementById('footerWrites');
  const footerElapsed = document.getElementById('footerElapsed');
  let sessionId = '';
  let disposed = false;
  let running = false;
  const text = (key, params) => (typeof window.__gonaviPageText === 'function' ? window.__gonaviPageText(key, params) : key);
  const setStatus = (value) => { status.textContent = value; };
  const setError = (error) => {
    const message = error && (error.message || error.code) ? String(error.message || error.code) : String(error || '');
    errorBox.hidden = !message;
    errorBox.textContent = message;
  };
  const maxRows = () => {
    const value = maxRowsInput ? Number(maxRowsInput.value) : 200;
    if (!Number.isFinite(value) || value < 1) return 200;
    return Math.min(2000, Math.floor(value));
  };
  const call = async (command, args) => {
    const payload = await window.gonavi.call('plugin.invoke', {
      command,
      arguments: args || {},
      connectionId: launch.connectionId || '',
    });
    if (!payload || typeof payload !== 'object' || typeof payload.ok !== 'boolean') {
      throw new Error('The plugin backend returned an invalid response.');
    }
    if (!payload.ok) {
      const failure = payload.error || {};
      const error = new Error(failure.message || failure.code || 'The command failed.');
      error.code = failure.code || 'internal';
      throw error;
    }
    if (!payload.data || typeof payload.data !== 'object') {
      throw new Error('The plugin backend returned invalid data.');
    }
    return payload.data;
  };
  const release = (id) => call('disconnect', { sessionId: id }).catch(() => {});
  const dispose = () => {
    disposed = true;
    const id = sessionId;
    sessionId = '';
    runButton.disabled = true;
    dbSelect.disabled = true;
    if (id) void release(id);
  };
  const setScope = () => {
    if (!scope) return;
    const database = dbSelect.value || launch.database || '(default)';
    const name = collection.value.trim();
    scope.textContent = name ? database + ' / ' + name : database;
  };
  const render = (data) => {
    resultBox.hidden = false;
    resultBox.textContent = '';
    if (emptyBox) emptyBox.hidden = true;
    if (data && data.table && Array.isArray(data.table.columns) && Array.isArray(data.table.rows)) {
      const table = document.createElement('table');
      const head = document.createElement('tr');
      data.table.columns.forEach((column) => {
        const th = document.createElement('th');
        th.textContent = typeof column === 'string' ? column : String(column.name || '');
        head.appendChild(th);
      });
      table.appendChild(head);
      data.table.rows.forEach((row) => {
        const tr = document.createElement('tr');
        (Array.isArray(row) ? row : [row]).forEach((cell) => {
          const td = document.createElement('td');
          td.textContent = cell === null || cell === undefined ? '' : (typeof cell === 'object' ? JSON.stringify(cell) : String(cell));
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      resultBox.appendChild(table);
      if (data.output && data.output.length) {
        const pre = document.createElement('pre');
        pre.textContent = data.output.join('\n');
        resultBox.appendChild(pre);
      }
      return;
    }
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(data, null, 2);
    resultBox.appendChild(pre);
  };
  const setResultMeta = (data) => {
    const rows = data && data.table && Array.isArray(data.table.rows) ? data.table.rows.length : 0;
    const elapsed = data && typeof data.elapsedMs === 'number' ? data.elapsedMs : null;
    const truncated = Boolean(data && data.table && data.table.truncated);
    if (resultMeta) {
      resultMeta.textContent = truncated ? text('truncated', { rows }) : rows + ' row(s)' + (elapsed === null ? '' : ' · ' + elapsed + ' ms');
      if (resultMeta.classList) resultMeta.classList.toggle('warn', truncated);
    }
    if (footerElapsed) footerElapsed.textContent = elapsed === null ? '—' : elapsed + ' ms';
  };
  const connect = async () => {
    setStatus(text('connecting'));
    try {
      const data = await call('connect', {
        connectionId: launch.connectionId || '',
        database: launch.database || '',
        collection: launch.collection || '',
        connectionName: launch.connectionName || 'MongoDB',
        environmentType: launch.environmentType || '',
        readOnly: launch.readOnly === true,
      });
      if (typeof data.sessionId !== 'string' || !data.sessionId) {
        throw new Error('The plugin backend did not return a sessionId.');
      }
      if (disposed) {
        await release(data.sessionId);
        return;
      }
      sessionId = data.sessionId;
      conn.textContent = data && data.host ? data.host : (launch.connectionName || 'MongoDB');
      if (footerHost) footerHost.textContent = (data && data.host) || (launch.connectionName || 'MongoDB');
      if (envChip) {
        envChip.hidden = !launch.environmentType;
        if (launch.environmentType) envChip.textContent = String(launch.environmentType);
      }
      if (readonlyChip) readonlyChip.hidden = !(data && data.readOnly);
      if (footerWrites) footerWrites.textContent = text(data && data.readOnly ? 'writesOff' : 'writes');
      if (footerWrites) footerWrites.className = data && data.readOnly ? 'danger' : '';
      if (data && Array.isArray(data.databases)) {
        dbSelect.textContent = '';
        data.databases.forEach((item) => {
          const name = typeof item === 'string' ? item : String(item && (item.name || item.database) || '');
          if (!name) return;
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          dbSelect.appendChild(option);
        });
        if (data.database) dbSelect.value = data.database;
      }
      collection.value = launch.collection || '';
      dbSelect.disabled = false;
      runButton.disabled = false;
      setScope();
      setStatus(text(data && data.readOnly ? 'readOnly' : 'ready'));
    } catch (error) {
      setStatus(text('notConnected'));
      setError(error);
      if (error && typeof console !== 'undefined' && console.error) console.error('mongo-shell connect failed', error);
    }
  };
  const run = async () => {
    if (!sessionId || disposed || running) return;
    running = true;
    runButton.disabled = true;
    setStatus(text('running'));
    setError(null);
    try {
      const data = await call('run', {
        sessionId,
        script: editor.value,
        database: dbSelect.value || '',
        collection: collection.value.trim(),
        maxRows: maxRows(),
      });
      render(data);
      setResultMeta(data);
      setStatus(text('done'));
    } catch (error) {
      setStatus(text('failed'));
      setError(error);
    } finally {
      running = false;
      runButton.disabled = disposed || !sessionId;
    }
  };
  runButton.addEventListener('click', run);
  if (clearButton) {
    clearButton.addEventListener('click', () => {
      editor.value = '';
      resultBox.hidden = true;
      resultBox.textContent = '';
      if (emptyBox) emptyBox.hidden = false;
      resultMeta.textContent = text('noQuery');
      resultMeta.classList.remove('warn');
      if (footerElapsed) footerElapsed.textContent = '—';
      setError(null);
      editor.focus();
    });
  }
  if (dbSelect && typeof dbSelect.addEventListener === 'function') dbSelect.addEventListener('change', setScope);
  if (collection && typeof collection.addEventListener === 'function') collection.addEventListener('input', setScope);
  editor.addEventListener('keydown', (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
      event.preventDefault();
      void run();
    }
  });
  window.addEventListener('pagehide', dispose);
  window.addEventListener('beforeunload', dispose);
  conn.textContent = launch.connectionName || 'MongoDB';
  if (footerHost) footerHost.textContent = launch.connectionName || 'MongoDB';
  void connect();
})();
</script>
</body>
</html>
